:root{
  --bg:#050506; --bg-2:#0a0a0c;
  --glass:rgba(255,255,255,0.055); --glass-2:rgba(255,255,255,0.09); --glass-3:rgba(255,255,255,0.14);
  --border:rgba(255,255,255,0.10); --border-soft:rgba(255,255,255,0.06);
  --accent:#4f82c4; --accent-2:#3b6293;
  --accent-dim:rgba(79,130,196,0.14); --accent-border:rgba(79,130,196,0.34);
  --accent-glow:0 0 28px rgba(79,130,196,0.28);
  --accent-glow-color:rgba(79,130,196,0.5);
  --t1:rgba(255,255,255,0.97); --t2:rgba(255,255,255,0.62); --t3:rgba(255,255,255,0.36);
  --danger:#F0605B; --safe-top:env(safe-area-inset-top,0px); --safe-bot:env(safe-area-inset-bottom,0px);
  --nav-h:74px; --r:20px; --r-sm:14px; --r-lg:28px; --ease:cubic-bezier(.22,1,.36,1);
  --blur:blur(28px) saturate(180%);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:'Manrope',system-ui,sans-serif;color:var(--t1);-webkit-font-smoothing:antialiased}
#app{width:100%;height:100%;display:flex;flex-direction:column;position:relative;overflow:hidden;max-width:560px;margin:0 auto;background:var(--bg)}
.page{position:absolute;inset:0;display:flex;flex-direction:column;opacity:0;pointer-events:none;transform:translateY(10px) scale(.98);transition:opacity .38s var(--ease),transform .38s var(--ease);padding-top:var(--safe-top);padding-bottom:calc(var(--nav-h) + var(--safe-bot) + 14px);overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.page.active{opacity:1;pointer-events:all;transform:translateY(0) scale(1)}
.page::-webkit-scrollbar{display:none}

/* Floating glass nav */
#nav{position:fixed;left:16px;right:16px;bottom:calc(var(--safe-bot) + 14px);max-width:528px;margin:0 auto;height:var(--nav-h);background:rgba(14,14,17,0.62);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--border-soft);border-radius:26px;display:flex;align-items:center;justify-content:space-around;z-index:100;box-shadow:0 20px 50px -12px rgba(0,0,0,.6)}
.ni{flex:1;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;-webkit-user-select:none;user-select:none;position:relative}
.ni:active{opacity:.6}
.ni svg{width:21px;height:21px;stroke:var(--t3);fill:none;stroke-width:1.6;transition:stroke .25s var(--ease)}
.ni span{font-size:9.5px;font-weight:700;color:var(--t3);letter-spacing:.2px;transition:color .25s var(--ease)}
.ni.on svg{stroke:var(--accent);filter:drop-shadow(0 0 5px rgba(79,130,196,0.5))}
.ni.on span{color:var(--accent)}
.ni-dot{display:none}

.ph{padding:22px 22px 12px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10;background:linear-gradient(var(--bg) 65%,transparent)}
.ph h1{font-size:29px;font-weight:800;letter-spacing:-.9px}
.back{display:flex;align-items:center;gap:2px;cursor:pointer;color:var(--t1);font-size:15px;font-weight:700;-webkit-user-select:none;user-select:none;background:var(--glass);backdrop-filter:var(--blur);border:1px solid var(--border-soft);padding:8px 14px 8px 10px;border-radius:20px}
.back svg{width:18px;height:18px;stroke:var(--t1);fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}

/* Glass card — the core surface language */
.card{background:var(--glass);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--border-soft);border-radius:var(--r);overflow:hidden;box-shadow:0 1px 0 rgba(255,255,255,.04) inset, 0 14px 36px -18px rgba(0,0,0,.65)}
.card.has-photo{backdrop-filter:none;-webkit-backdrop-filter:none;background:#000}

.tog{width:48px;height:29px;border-radius:15px;background:var(--glass-2);border:1px solid var(--border);position:relative;cursor:pointer;transition:background .3s var(--ease);flex-shrink:0}
.tog::after{content:'';position:absolute;top:2.5px;left:2.5px;width:22px;height:22px;border-radius:50%;background:linear-gradient(180deg,#fff,#e4e4e4);box-shadow:0 2px 5px rgba(0,0,0,.4);transition:transform .3s var(--ease)}
.tog.on{background:linear-gradient(135deg,var(--accent),var(--accent-2));border-color:transparent;box-shadow:var(--accent-glow)}
.tog.on::after{transform:translateX(19px)}

.lg{margin:0 20px;background:var(--glass);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--border-soft);border-radius:var(--r);overflow:hidden}
.lr{display:flex;align-items:center;gap:14px;padding:16px 18px;border-bottom:1px solid var(--border-soft);cursor:pointer;-webkit-user-select:none;user-select:none;transition:background .18s}
.lr:last-child{border-bottom:none} .lr:active{background:rgba(255,255,255,.05)}
.li{width:42px;height:42px;border-radius:13px;background:var(--glass-2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:transform .2s var(--ease);overflow:hidden}
.lr:active .li{transform:scale(.92)}
.li svg{width:20px;height:20px;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.li.on{background:var(--accent-dim);border-color:var(--accent-border);box-shadow:0 0 16px rgba(79,130,196,0.18)}
.lc{flex:1;min-width:0} .lt{font-size:15.5px;font-weight:700;letter-spacing:-.1px}
.ls{font-size:12px;color:var(--t2);margin-top:2px;font-weight:500}
.la{display:flex;align-items:center;gap:8px;flex-shrink:0} .la svg{width:16px;height:16px;stroke:var(--t3);fill:none;stroke-width:2}

.dot{width:7px;height:7px;border-radius:50%;background:#4ADE80;box-shadow:0 0 10px rgba(74,222,128,.8);display:inline-block;flex-shrink:0}

.sl{font-size:11.5px;font-weight:800;letter-spacing:1.4px;color:var(--t3);text-transform:uppercase;padding:0 22px;margin:26px 0 12px}

.sc{margin:0 20px 11px;background:var(--glass);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--border-soft);border-radius:var(--r-lg);display:flex;align-items:center;gap:16px;padding:17px 19px;cursor:pointer;transition:all .25s var(--ease);-webkit-user-select:none;user-select:none}
.sc:active{transform:scale(.98);border-color:var(--accent-border);background:var(--accent-dim)}
.si{width:52px;height:52px;border-radius:16px;background:linear-gradient(155deg,var(--glass-2),var(--glass));border:1px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:transform .22s var(--ease)}
.sc:active .si{transform:scale(.9)}
.si svg{width:23px;height:23px;stroke:rgba(255,255,255,.85);fill:none;stroke-width:1.6}
.st{font-size:16px;font-weight:800;letter-spacing:-.2px} .sb{font-size:12px;color:var(--t2);margin-top:2px;font-weight:500}
.sp{width:38px;height:38px;border-radius:50%;background:var(--accent-dim);border:1px solid var(--accent-border);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sp svg{width:12px;height:12px;fill:var(--accent);stroke:none}

/* Cinematic room photography */
.rphoto{position:relative;overflow:hidden;background:#000}
.rphoto::before{content:'';position:absolute;inset:0;opacity:.6;mix-blend-mode:overlay;background-image:radial-gradient(circle at 25% 20%,rgba(255,255,255,.08),transparent 45%)}
.rphoto.has-photo::before{display:none}
.rphoto::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05) 0%,transparent 30%,rgba(0,0,0,.35) 60%,rgba(0,0,0,.92) 100%)}
.rphoto-content{position:relative;z-index:2}

.hscroll{overflow-x:auto;scrollbar-width:none;touch-action:pan-x} .hscroll::-webkit-scrollbar{display:none}
.sp8{height:8px}.sp16{height:16px}.sp40{height:56px}

.qc{transition:opacity .18s var(--ease),transform .18s var(--ease)} .qc:active{opacity:.5;transform:scale(.95)}
.room-tile{transition:transform .3s var(--ease),filter .3s var(--ease)}
.carousel-item{transition:transform .2s ease-out,opacity .2s ease-out;transform-origin:center center} .room-tile:active{transform:scale(.97);filter:brightness(.85)}
.signature-line{width:30px;height:2px;border-radius:2px;background:linear-gradient(90deg,var(--accent),var(--accent-2));opacity:.9;box-shadow:0 0 8px rgba(79,130,196,0.4)}

.home-reveal{animation:reveal .6s var(--ease) both}
.home-reveal:nth-child(2){animation-delay:.05s} .home-reveal:nth-child(3){animation-delay:.1s}
.home-reveal:nth-child(4){animation-delay:.15s} .home-reveal:nth-child(5){animation-delay:.2s}
@keyframes reveal{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@media (prefers-reduced-motion:reduce){.home-reveal,.qc,.room-tile{animation:none!important;transition:none!important}}

#toast{position:fixed;bottom:calc(var(--nav-h) + var(--safe-bot) + 28px);left:50%;transform:translateX(-50%) translateY(8px);background:rgba(20,20,24,0.85);backdrop-filter:var(--blur);border:1px solid var(--border);padding:11px 22px;border-radius:26px;font-size:13.5px;font-weight:700;color:var(--t1);opacity:0;transition:all .32s var(--ease);pointer-events:none;white-space:nowrap;z-index:200}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.acbtn{padding:13px 6px;border-radius:var(--r-sm);background:var(--glass-2);border:1px solid var(--border);color:var(--t1);font-size:14px;font-weight:700;cursor:pointer;text-align:center;transition:all .22s var(--ease)}
.acbtn:active{background:var(--glass-3);transform:scale(.95)}
.acbtn.sel{background:var(--accent-dim);border-color:var(--accent-border);color:var(--accent);box-shadow:0 0 14px rgba(79,130,196,0.16)}
/* Ar-condicionado premium */
.acard{padding:22px 20px 26px;position:relative;overflow:hidden}
.acard::before{content:'';position:absolute;left:-20%;right:-20%;top:-30%;height:75%;background:radial-gradient(closest-side,rgba(79,130,196,0.2),transparent);opacity:0;transition:opacity .5s var(--ease);pointer-events:none}
.acard.on::before{opacity:1}
.acard>*{position:relative}
.acdial{position:relative;width:240px;height:240px;margin:6px auto 0}
.acdial svg{position:absolute;inset:0;overflow:visible}
.acdial .acmid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
.actemp{font-size:68px;font-weight:200;letter-spacing:-4px;line-height:1;transition:opacity .4s var(--ease)}
.actemp small{font-size:24px;font-weight:500;letter-spacing:0;vertical-align:top;position:relative;top:9px;margin-left:3px;color:var(--t2)}
.acstat{margin-top:10px;font-size:11px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--t3);display:flex;align-items:center;gap:7px}
.acstat.on{color:var(--accent)}
.acstat i{width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent-glow-color)}
.acrange{position:absolute;bottom:12px;font-size:11px;font-weight:700;color:var(--t3)}
.accontrols{display:flex;align-items:center;justify-content:center;gap:26px;margin-top:2px}
.acstep{width:56px;height:56px;border-radius:50%;background:var(--glass);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .2s var(--ease),opacity .3s,background .2s}
.acstep svg{width:22px;height:22px;stroke:var(--t1);fill:none;stroke-width:2;stroke-linecap:round}
.acstep:active{transform:scale(.88);background:var(--glass-3)}
.acstep.dis{opacity:.28}
.acpw{width:92px;height:92px;border-radius:50%;position:relative;cursor:pointer;border:1px solid var(--border);background:radial-gradient(circle at 30% 22%,rgba(255,255,255,.16),rgba(255,255,255,.02) 62%),var(--glass-2);display:flex;align-items:center;justify-content:center;transition:transform .25s var(--ease),background .45s var(--ease),border-color .45s}
.acpw::before{content:'';position:absolute;inset:-9px;border-radius:50%;border:1px solid var(--border-soft);transition:border-color .45s}
.acpw svg{width:36px;height:36px;stroke:var(--t3);fill:none;stroke-width:2;stroke-linecap:round;transition:stroke .3s}
.acpw:active{transform:scale(.9)}
.acpw.on{background:radial-gradient(circle at 30% 22%,rgba(255,255,255,.35),transparent 55%),linear-gradient(145deg,var(--accent),var(--accent-2));border-color:transparent;animation:acPulse 3s ease-in-out infinite}
.acpw.on::before{border-color:var(--accent-border)}
.acpw.on svg{stroke:#fff;filter:drop-shadow(0 0 7px rgba(255,255,255,.6))}
.acpwl{text-align:center;margin-top:16px;font-size:11.5px;font-weight:600;color:var(--t3);letter-spacing:.3px}
/* Controle remoto premium */
.rmt{padding:20px 18px 22px}
.rmt-pw{display:flex;gap:10px;margin:18px 0 4px}
.rmt-pb{flex:1;height:58px;border-radius:18px;display:flex;align-items:center;justify-content:center;gap:10px;font-size:13px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;cursor:pointer;color:var(--t2);background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.03));border:1px solid var(--border);transition:transform .2s var(--ease),background .25s,border-color .25s,box-shadow .25s}
.rmt-pb svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.rmt-pb.on{color:#fff;background:linear-gradient(145deg,var(--accent),var(--accent-2));border-color:transparent;box-shadow:var(--accent-glow)}
.rmt-pb:active{transform:scale(.94)}
.dpad{position:relative;width:224px;height:224px;margin:20px auto 6px;border-radius:50%;background:radial-gradient(circle at 50% 22%,rgba(255,255,255,.11),rgba(255,255,255,.02) 68%),var(--glass);border:1px solid var(--border);box-shadow:inset 0 0 34px rgba(0,0,0,.4),0 20px 44px -20px rgba(0,0,0,.75)}
.dpad::before{content:'';position:absolute;inset:52px;border-radius:50%;border:1px solid var(--border-soft)}
.dpad .dp{position:absolute;width:66px;height:66px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .15s,transform .15s var(--ease)}
.dpad .dp svg{width:26px;height:26px;stroke:var(--t1);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;opacity:.85}
.dpad .dp:active{background:var(--accent-dim);transform:scale(.88)}
.dpad .dp.u{top:6px;left:50%;margin-left:-33px}
.dpad .dp.d{bottom:6px;left:50%;margin-left:-33px}
.dpad .dp.l{left:6px;top:50%;margin-top:-33px}
.dpad .dp.r{right:6px;top:50%;margin-top:-33px}
.dpad .dpok{position:absolute;left:50%;top:50%;width:84px;height:84px;margin:-42px 0 0 -42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;letter-spacing:1px;color:#fff;cursor:pointer;background:radial-gradient(circle at 30% 22%,rgba(255,255,255,.32),transparent 55%),linear-gradient(145deg,var(--accent),var(--accent-2));box-shadow:var(--accent-glow),inset 0 1px 0 rgba(255,255,255,.25);transition:transform .2s var(--ease)}
.dpad .dpok:active{transform:scale(.9)}
.rmt-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px;margin-top:18px}
.rb{min-height:50px;padding:12px 8px;border-radius:16px;display:flex;align-items:center;justify-content:center;gap:7px;text-align:center;font-size:12.5px;font-weight:700;letter-spacing:.4px;color:var(--t1);cursor:pointer;background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.03));border:1px solid var(--border);transition:transform .18s var(--ease),background .2s,border-color .2s,color .2s}
.rb svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.rb:active{transform:scale(.93);background:var(--accent-dim);border-color:var(--accent-border);color:var(--accent)}
@keyframes acPulse{0%,100%{box-shadow:0 0 0 0 rgba(79,130,196,0.3),0 0 34px rgba(79,130,196,0.42)}50%{box-shadow:0 0 0 11px rgba(79,130,196,0),0 0 48px rgba(79,130,196,0.62)}}
@media (prefers-reduced-motion:reduce){.acpw.on{animation:none;box-shadow:0 0 34px rgba(79,130,196,0.42)}}
.pbtn{flex:1;padding:14px;border-radius:var(--r-sm);background:var(--glass-2);border:1px solid var(--border);color:var(--t1);font-size:13.5px;font-weight:700;cursor:pointer;font-family:'Manrope',sans-serif;transition:all .22s}
.pbtn:active{background:var(--glass-3);transform:scale(.96)}

/* Home hero — full-bleed cinematic backdrop */
.hero{position:relative;height:300px;flex-shrink:0;overflow:hidden;background:radial-gradient(140% 100% at 20% -10%,#1c1e26 0%,#0d0e13 55%,#050506 100%)}
.hero::before{content:'';position:absolute;inset:0;background-image:radial-gradient(circle at 15% 15%,rgba(79,130,196,0.14),transparent 45%),radial-gradient(circle at 85% 0%,rgba(255,255,255,.05),transparent 40%)}
.hero::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,var(--bg) 100%)}

/* celulares pequenos */
@media (max-width:359px){
  .hero-name{font-size:27px!important}
  .hero-clock{font-size:54px!important}
  .ph h1{font-size:25px}
  .acdial{transform:scale(.9);margin-bottom:-12px}
  .brand-top{width:84px;padding:6px 9px}
  .ph{padding-right:112px}
}

/* ═════ TABLET (≥ 700px) ═════ */
@media (min-width:700px){
  :root{--nav-h:80px;--r:22px}
  #app{max-width:1100px}
  #nav{max-width:620px;border-radius:30px}
  .ni svg{width:24px;height:24px}
  .ni span{font-size:11px}
  .brand-top{top:calc(var(--safe-top) + 26px);right:calc(var(--sr) + 30px);width:128px;padding:9px 14px;border-radius:16px}
  .ph{padding:28px 20px 16px;padding-right:170px}
  .ph h1{font-size:36px;letter-spacing:-1.1px}
  .sl{padding:0 22px;font-size:12.5px}
  .hero{height:380px}
  .hero-greet{font-size:17px!important}
  .hero-name{font-size:46px!important}
  .hero-clock{font-size:92px!important;letter-spacing:-4px!important}
  .carousel-item{min-width:44%!important;height:210px!important}
  .gl{grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
  .lt{font-size:16.5px}
  .st{font-size:17px}
  .rd-hero{height:300px!important}
  .rd-body{column-count:2;column-gap:12px}
  .rd-body>div{break-inside:avoid;-webkit-column-break-inside:avoid;page-break-inside:avoid}
  #p-devices .lg{display:grid;grid-template-columns:1fr 1fr}
  #p-devices .lg .lr{border-bottom:1px solid var(--border-soft)}
  #p-devices .lg .lr:nth-child(odd){border-right:1px solid var(--border-soft)}
  #p-devices .lg .lr:last-child{border-bottom:none}
  #p-devices .lg .lr:nth-last-child(2):nth-child(odd){border-bottom:none}
  #p-devices .lg .lr:last-child:nth-child(odd){border-right:none}
  .brand-foot .brand-logo{width:160px}
}

/* ═════ TABLET GRANDE / PAISAGEM (≥ 1000px) ═════ */
@media (min-width:1000px){
  .carousel-item{min-width:31%!important}
  .gl{grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
  .rd-body{column-count:3}
}
/* celular deitado / telas baixas */
@media (max-height:520px) and (orientation:landscape){
  :root{--nav-h:60px}
  .hero{height:210px}
  .hero-clock{font-size:46px!important}
  .hero-name{font-size:26px!important}
  .rd-hero{height:160px!important}
  .carousel-item{height:140px!important}
  .ph{padding-top:14px;padding-bottom:8px}
  .ph h1{font-size:28px}
  .hero-greet{font-size:13px!important}
  .brand-top{top:calc(var(--safe-top) + 12px);width:84px;padding:5px 9px}
  .brand-foot{padding-top:18px}
}


/* ═════ ADMIN: usuários e cenas ═════ */
#sheet{position:absolute;inset:0;z-index:150;display:none}
#sheet.open{display:block}
.sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.62);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.sheet-p{position:absolute;left:0;right:0;bottom:0;max-height:92%;overflow-y:auto;background:#0e0e11;border:1px solid var(--border-soft);border-radius:28px 28px 0 0;padding:20px 20px calc(var(--safe-bot) + 26px);animation:sheetUp .35s var(--ease)}
@keyframes sheetUp{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sheet-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.sheet-h h2{font-size:21px;font-weight:800;letter-spacing:-.4px}
.sheet-x{width:34px;height:34px;border-radius:50%;background:var(--glass-2);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:18px;color:var(--t2)}
.fld{margin:14px 0 0}
.fld label{display:block;font-size:11.5px;font-weight:800;letter-spacing:1.2px;color:var(--t3);text-transform:uppercase;margin-bottom:7px}
.fld input{width:100%;padding:14px 16px;border-radius:var(--r-sm);background:var(--glass-2);border:1px solid var(--border);color:var(--t1);font-size:16px;font-family:'Manrope',sans-serif;outline:none}
.fld input:focus{border-color:var(--accent-border)}
.seg{display:flex;gap:8px}
.segi{flex:1;padding:13px 6px;text-align:center;border-radius:var(--r-sm);background:var(--glass-2);border:1px solid var(--border);font-size:14px;font-weight:700;cursor:pointer;color:var(--t2)}
.segi.on{background:var(--accent-dim);border-color:var(--accent-border);color:var(--accent)}
.hxl{border:1px solid var(--border-soft);border-radius:var(--r);overflow:hidden;background:var(--glass)}
.hxl .lr{padding:12px 14px}
.hxc{display:flex;gap:6px;flex-shrink:0}
.hxc span{padding:7px 11px;border-radius:12px;background:var(--glass-2);border:1px solid var(--border);font-size:12px;font-weight:700;color:var(--t2);cursor:pointer}
.hxc span.on{background:var(--accent-dim);border-color:var(--accent-border);color:var(--accent)}
.hxc span.off{background:rgba(240,96,91,.12);border-color:rgba(240,96,91,.35);color:var(--danger)}
.hx-btn{width:100%;margin-top:20px;padding:16px;border-radius:var(--r-sm);background:linear-gradient(135deg,var(--accent),var(--accent-2));border:none;color:#fff;font-size:15px;font-weight:800;cursor:pointer;font-family:'Manrope',sans-serif}
.hx-btn:active{transform:scale(.97)}
.hx-del{font-size:12px;font-weight:700;color:var(--danger);padding:8px 10px;cursor:pointer}
.hx-note{font-size:11.5px;color:var(--t3);margin-top:10px;line-height:1.45}
.hx-err{color:var(--danger);font-size:12.5px;font-weight:600;margin-top:10px;min-height:16px}
@media (min-width:700px){.sheet-p{left:50%;right:auto;width:580px;bottom:auto;top:50%;transform:translate(-50%,-50%);border-radius:28px;max-height:88%;animation:none}}

/* Fotos dos ambientes */
.ph-th{width:48px;height:36px;border-radius:10px;background-size:cover;background-position:center;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden}
.ph-act{display:flex;flex-direction:column;gap:5px;flex-shrink:0}
.ph-act span{padding:7px 11px;border-radius:12px;background:var(--glass-2);border:1px solid var(--border);font-size:12px;font-weight:700;color:var(--t2);cursor:pointer;text-align:center;white-space:nowrap}
.ph-act span.add{background:var(--accent-dim);border-color:var(--accent-border);color:var(--accent)}
.ph-act span.off{background:rgba(240,96,91,.12);border-color:rgba(240,96,91,.35);color:var(--danger)}
.ph-act span:active{transform:scale(.95)}

// ── COMANDO REAL — nuvem ControlArt ────────────────────
// A nuvem só aceita sendScene,ID (confirmado por teste real) — não aceita
// comando bruto de dispositivo. Por isso cada dispositivo controlável de
// verdade tem um par de cenas ocultas (onScene/offScene) vindas do projeto.
//
// Tenta ler a resposta de verdade (fetch normal); se a nuvem bloquear
// leitura entre origens (CORS), cai pro modo "às cegas" (no-cors) —
// nesse caso o comando ainda é enviado, só não dá pra confirmar.
var caQueue=Promise.resolve();
// Comando real do usuário tem prioridade sobre polling de status: enquanto
// houver comando esperando, cada chamada de polling AINDA NA FILA (não
// iniciada) se cancela sozinha em vez de rodar — assim o comando não fica
// preso atrás da consulta de status de vários módulos. Devices pulados
// pegam o status no próximo ciclo, sem prejuízo real.
var priorityWaiting=0;
function sendControlArtCommand(cmd, macRef, opts) {
  opts=opts||{};
  if (!STATE.appToken) return Promise.resolve({sent:false, confirmed:false});
  var url = 'https://cacmd2.controlartcloud.com.br/p2pca?tc=' + STATE.appToken + '/' + cmd;
  if (opts.priority) priorityWaiting++;
  var run=function(){
    if (opts.isPoll && priorityWaiting>0) {
      return Promise.resolve({sent:false, confirmed:false, skipped:true});
    }
    return fetch(url)
      .then(function(res){ return res.text(); })
      .then(function(text){
        var confirmed = macRef ? text.indexOf('setmd,'+macRef+',') !== -1 || text.indexOf(macRef) !== -1 : true;
        return {sent:true, confirmed:confirmed, raw:text};
      })
      .catch(function(){
        return fetch(url, { mode: 'no-cors' })
          .then(function(){ return {sent:true, confirmed:false, blind:true}; })
          .catch(function(){ return {sent:false, confirmed:false}; });
      });
  };
  // Fila única: nunca duas chamadas simultâneas pra nuvem — evita
  // polling e comando de cena colidindo e derrubando um ao outro.
  var result=caQueue.then(run);
  if (opts.priority) {
    result = result.then(function(r){ priorityWaiting--; return r; }, function(e){ priorityWaiting--; throw e; });
  }
  caQueue=result.catch(function(){});
  return result;
}
function sendDeviceCommand(d) {
  var sceneId = d.on ? d.onScene : d.offScene;
  if (!STATE.appToken || !sceneId) {
    return Promise.resolve({sent:false, confirmed:false, noLink:true}); // sem vínculo real — permanece simulado
  }
  return sendControlArtCommand('sendScene,' + sceneId, d.mac, {priority:true});
}
// Cortina: 3 estados (abrir/fechar/parar) em vez de liga/desliga.
// onScene=abrir, offScene=fechar, stopScene=parar (só existe se o projeto
// tiver uma cena "Parar X" própria — nem todo projeto tem).
function sendCurtainCommand(d, action) {
  var sceneId = action === 'open' ? d.onScene : action === 'close' ? d.offScene : d.stopScene;
  if (!STATE.appToken || !sceneId) {
    return Promise.resolve({sent:false, confirmed:false, noLink:true});
  }
  return sendControlArtCommand('sendScene,' + sceneId, d.mac, {priority:true});
}

// ── CONSULTA DE STATUS REAL — reflete o interruptor físico ──
// mdcmd_fgetmd,MAC3,MAC4,MAC5 devolve "setmd,MAC,v0,v1,v2,v3,v4,v5" —
// esse tipo de módulo usa 3 entradas + 3 saídas, então o estado do canal N
// fica na posição (3+N). Confirmado por teste real (ligado vs desligado).
function macToDecimal(mac){ return mac.split('-').map(function(h){return parseInt(h,16);}); }
var pollBusy=false;
function pollDeviceStatus(){
  if(!STATE.appToken || pollBusy) return;
  var macs=[]; STATE.devices.forEach(function(d){ if(d.mac && d.channel!==null && macs.indexOf(d.mac)===-1) macs.push(d.mac); });
  if(!macs.length) return;
  pollBusy=true;
  var pending=macs.length;
  function done(){ pending--; if(pending<=0) pollBusy=false; }
  macs.forEach(function(mac){
    var mb=macToDecimal(mac);
    sendControlArtCommand('mdcmd_fgetmd,'+mb[0]+','+mb[1]+','+mb[2], mac, {isPoll:true}).then(function(r){
      if(!r.confirmed || !r.raw){ done(); return; }
      var idx=r.raw.indexOf('setmd,'+mac+',');
      if(idx===-1){ done(); return; }
      var rest=r.raw.slice(idx+('setmd,'+mac+',').length).split(/[\r\n]/)[0];
      var vals=rest.split(',').map(function(v){return v.trim();});
      var changed=false;
      STATE.devices.forEach(function(d){
        if(d.mac===mac && d.channel!==null){
          var pos=3+d.channel;
          if(vals[pos]!==undefined){
            var newOn = vals[pos]==='1';
            if(newOn!==d.on){ d.on=newOn; changed=true; }
          }
        }
      });
      if(changed){ refreshAll(); if(STATE.curPage==='p-devices')renderDevices(); }
      done();
    });
  });
}
var pollTimer=null;
function startPolling(){
  if(pollTimer) return;
  pollDeviceStatus();
  pollTimer=setInterval(pollDeviceStatus, 10000);
}
document.addEventListener('visibilitychange', function(){
  if(document.hidden){ if(pollTimer){ clearInterval(pollTimer); pollTimer=null; } }
  else { startPolling(); }
});
// ── FIBARO (MQTT sobre WebSocket → ponte Quick App no HC3) ──────
// Mesma tela e mesma lógica: dispositivos com d.fb vão pelo broker,
// o resto continua pela nuvem ControlArt.
var FB = {"wsUrl":"wss://broker.hivemq.com:8884/mqtt","base":"fibaro-teste-x7k2q9","username":null,"password":null};
var fbSeen={}, fbVerifyTimers={}, fbResyncAt=0;
var fbClient=null, fbOnline=false, fbRefreshTimer=null, fbSpTimers={}, fbQueue=[], fbQueueTimer=null, fbLastErr='';
function hasRemote(d){return !!((d.irButtons&&d.irButtons.length)||(d.fb&&d.fb.buttons&&d.fb.buttons.length));}
function fbFind(realId){return STATE.devices.find(function(d){return d.fb && d.fb.id===realId;});}
function fbWhy(final){
  if(typeof mqtt==='undefined') return 'Biblioteca MQTT não carregou — verifique a internet do aparelho';
  if(final) return 'Sem conexão com o Fibaro'+(fbLastErr?' ('+fbLastErr+')':'');
  return 'Reconectando ao Fibaro...';
}
function fbKick(){
  if(!FB || typeof mqtt==='undefined') return;
  if(!fbClient){ fbConnect(); return; }
  if(!fbClient.connected && !fbClient.reconnecting){ try{ fbClient.reconnect(); }catch(e){} }
}
function fbResync(){
  var now=Date.now();
  if(!fbClient || !fbOnline || now-fbResyncAt<2000) return;
  fbResyncAt=now;
  fbClient.publish(FB.base+'/comandos', JSON.stringify({cmd:'list',ts:now}), {qos:1});
}
function fbVerify(obj){
  // Comando de dispositivo sem retorno de estado em 3,5s: pede o estado real e corrige a tela
  if(obj.cmd || obj.id===undefined) return;
  var t0=Date.now(), id=obj.id;
  clearTimeout(fbVerifyTimers[id]);
  fbVerifyTimers[id]=setTimeout(function(){ if((fbSeen[id]||0)<t0) fbResync(); },3500);
}
setInterval(function(){ if(!document.hidden) fbResync(); },45000);
var fbRetried={};
function fbSend(obj){
  // Publica com confirmação do broker (PUBACK). Sem confirmação em 3s = conexão morta:
  // reconecta e reenvia uma vez (a ponte descarta duplicado pelo ts).
  var done=false;
  var t=setTimeout(function(){ if(!done) fbSendFail(obj); },3000);
  try{
    fbClient.publish(FB.base+'/comandos', JSON.stringify(obj), {qos:1}, function(err){
      done=true; clearTimeout(t);
      if(err) fbSendFail(obj);
    });
  }catch(e){ done=true; clearTimeout(t); fbSendFail(obj); }
  fbVerify(obj);
}
function fbSendFail(obj){
  if(fbRetried[obj.ts]) return;
  fbRetried[obj.ts]=1;
  if(fbQueue.length<10) fbQueue.push({o:obj,t:Date.now()});
  fbReset();
}
function fbFlush(){
  var now=Date.now(), q=fbQueue; fbQueue=[];
  clearTimeout(fbQueueTimer);
  q.forEach(function(it){ if(now-it.t<8000) fbSend(it.o); });
}
function fbPublish(obj){
  obj.ts=Date.now();
  if(fbClient && fbOnline){ fbSend(obj); return true; }
  // Sem conexão agora: tenta reconectar e envia assim que voltar (até 8s)
  if(fbQueue.length<10) fbQueue.push({o:obj,t:Date.now()});
  fbKick();
  toast(fbWhy(false));
  clearTimeout(fbQueueTimer);
  fbQueueTimer=setTimeout(function(){ if(fbQueue.length){ fbQueue=[]; toast(fbWhy(true)); } },8000);
  return true;
}
function fbSend(d, action, args){
  var m={id:d.fb.id, action:action};
  if(args && args.length) m.args=args;
  return fbPublish(m);
}
function fbToggle(d){
  if(d.kind==='hvac') return fbSend(d,'setThermostatMode',[d.on?(d.fb.modeOn||'Cool'):'Off']);
  return fbSend(d, d.on?'turnOn':'turnOff');
}
function fbSetpoint(d){
  clearTimeout(fbSpTimers[d.id]);
  fbSpTimers[d.id]=setTimeout(function(){ fbSend(d,d.fb.setpoint,[d.val]); },700);
}
function fbApplyProp(d, prop, val){
  var f=d.fb, before=d.on+'|'+d.val;
  if(d.kind==='hvac'){
    var want = f.setpoint==='setHeatingThermostatSetpoint' ? 'heatingThermostatSetpoint' : (f.setpoint==='setThermostatSetpoint' ? 'thermostatSetpoint' : 'coolingThermostatSetpoint');
    if(prop==='thermostatMode'){ d.on=(String(val).toLowerCase()!=='off'); }
    else if(prop===want){
      var v=parseFloat((val && typeof val==='object') ? val.value : val);
      if(!isNaN(v)) d.val=Math.round(v);
    }
  } else if(f.canToggle && (prop==='value' || prop==='state')){
    var sv=(typeof val==='string')?val.toLowerCase():val;
    if(sv===true || sv==='true' || sv==='on') d.on=true;
    else if(sv===false || sv==='false' || sv==='off') d.on=false;
    else if(typeof sv==='number') d.on=sv>0;
    else if(typeof sv==='string' && sv!=='' && !isNaN(parseFloat(sv))) d.on=parseFloat(sv)>0;
  }
  return before!==(d.on+'|'+d.val);
}
function fbScheduleRefresh(){
  clearTimeout(fbRefreshTimer);
  fbRefreshTimer=setTimeout(function(){ refreshAll(); },150);
}
function fbConnect(){
  if(!FB || !FB.wsUrl || !FB.base || fbClient) return;
  if(typeof mqtt==='undefined'){ console.warn('Biblioteca MQTT não carregou'); return; }
  var cid=''; try{ cid=localStorage.getItem('fbCid')||''; if(!cid){ cid='app-'+Math.random().toString(16).slice(2,12); localStorage.setItem('fbCid',cid); } }catch(e){}
  if(!cid) cid='app-'+Math.random().toString(16).slice(2,12);
  var opts={ clientId:cid, clean:false, reconnectPeriod:2000, connectTimeout:10000, keepalive:15 };
  if(FB.username){ opts.username=FB.username; opts.password=FB.password||''; }
  fbClient=mqtt.connect(FB.wsUrl, opts);
  fbClient.on('connect', function(){
    fbOnline=true;
    fbClient.subscribe(FB.base+'/estado/+',{qos:1});
    fbClient.subscribe(FB.base+'/dispositivos/+',{qos:1});
    fbClient.publish(FB.base+'/comandos', JSON.stringify({cmd:'list',ts:Date.now()}), {qos:1});
    fbLastErr='';
    fbFlush();
  });
  fbClient.on('close', function(){ fbOnline=false; });
  fbClient.on('offline', function(){ fbOnline=false; });
  fbClient.on('error', function(err){ fbOnline=false; fbLastErr=(err&&err.message)?String(err.message).slice(0,60):'erro de rede'; });
  fbClient.on('message', function(topic, payload){
    var msg; try{ msg=JSON.parse(payload.toString()); }catch(e){ return; }
    if(!msg) return;
    var changed=false, d;
    if(msg.id!==undefined) fbSeen[msg.id]=Date.now();
    if(topic.indexOf(FB.base+'/estado/')===0){
      d=fbFind(msg.id);
      if(d) changed=fbApplyProp(d, msg.property, msg.value);
    } else if(topic.indexOf(FB.base+'/dispositivos/')===0){
      d=fbFind(msg.id);
      if(d && msg.properties){
        Object.keys(msg.properties).forEach(function(k){ if(fbApplyProp(d,k,msg.properties[k])) changed=true; });
      }
    }
    if(changed) fbScheduleRefresh();
  });
}
var fbHiddenAt=0;
function fbReset(){
  if(fbClient){ try{ fbClient.removeAllListeners(); fbClient.end(true); }catch(e){} fbClient=null; }

}
function fbWake(force){
  var away = force || (fbHiddenAt && Date.now()-fbHiddenAt>5000);

}

function setupCarousel(containerId){
  var container=document.getElementById(containerId);
  if(!container) return;
  var ticking=false;
  function update(){
    var rect=container.getBoundingClientRect();
    var centerX=rect.left+rect.width/2;
    var items=container.querySelectorAll('.carousel-item');
    items.forEach(function(item){
      var r=item.getBoundingClientRect();
      var itemCenter=r.left+r.width/2;
      var dist=Math.abs(centerX-itemCenter);
      var maxDist=rect.width/2+r.width/2;
      var t=Math.min(1,dist/maxDist);
      var scale=1.08-t*0.22;
      item.style.transform='scale('+scale.toFixed(3)+')';
      item.style.opacity=(1-t*0.3).toFixed(2);
      item.style.zIndex=String(Math.round((1-t)*10));
    });
    ticking=false;
  }
  container.addEventListener('scroll',function(){
    if(!ticking){ requestAnimationFrame(update); ticking=true; }
  },{passive:true});
  update();
}

var RMT_ROLE={'^':'up','▲':'up','up':'up','cima':'up','v':'down','▼':'down','down':'down','baixo':'down','<':'left','◀':'left','left':'left','esquerda':'left','esq':'left','>':'right','▶':'right','right':'right','direita':'right','dir':'right','ok':'ok','enter':'ok','select':'ok','on':'on','ligar':'on','liga':'on','power on':'on','pwon':'on','turnliga':'on','off':'off','desligar':'off','desliga':'off','power off':'off','pwoff':'off','turndesliga':'off'};
var RMT_PATH={up:'M6 15l6-6 6 6',down:'M6 9l6 6 6-6',left:'M15 6l-6 6 6 6',right:'M9 6l6 6-6 6'};
var RMT_PWR='<svg viewBox="0 0 24 24"><path d="M12 3v8.5"/><path d="M6.4 6.9a8 8 0 1 0 11.2 0"/></svg>';
function rmtRole(b){var k=String(b.label||'').trim().toLowerCase();var ac=String(b.action||'').toLowerCase();return RMT_ROLE[k]||RMT_ROLE[ac]||null;}
function rmtEsc(t){return String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function rmtIcon(label){
  var k=String(label||'').toLowerCase();
  if(k.indexOf('play')!==-1||k.indexOf('pause')!==-1) return '<svg viewBox="0 0 24 24"><path d="M8 5l10 7-10 7z"/></svg>';
  if(k==='home'||k==='inicio'||k==='início') return '<svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7"/><path d="M6 10v9h12v-9"/></svg>';
  if(k==='menu'||k==='opções'||k==='opcoes'||k==='options') return '<svg viewBox="0 0 24 24"><path d="M5 7h14"/><path d="M5 12h14"/><path d="M5 17h14"/></svg>';
  if(k==='voltar'||k==='back'||k==='exit') return '<svg viewBox="0 0 24 24"><path d="M10 6l-6 6 6 6"/><path d="M4 12h11a5 5 0 0 1 5 5"/></svg>';
  return '';
}
function irRemoteCard(d){
  var fbL=(d.fb&&d.fb.buttons&&d.fb.buttons.length)?d.fb.buttons:null;
  var list=fbL||d.irButtons||[];
  var act=fbL?'fbbtn':'irbtn';
  function btn(i,cls,inner){return '<button class="'+cls+'" data-action="'+act+'" data-id="'+d.id+'" data-idx="'+i+'" aria-label="'+rmtEsc(list[i].label)+'">'+inner+'</button>';}
  var roles={}, rest=[];
  list.forEach(function(b,i){var r=rmtRole(b); if(r && roles[r]===undefined) roles[r]=i; else rest.push(i);});
  var hasDpad=roles.up!==undefined&&roles.down!==undefined&&roles.left!==undefined&&roles.right!==undefined;
  if(!hasDpad){['up','down','left','right','ok'].forEach(function(r){ if(roles[r]!==undefined){ rest.push(roles[r]); delete roles[r]; } }); }
  rest.sort(function(x,y){return x-y;});
  var html='<div class="card acard on rmt">'
    +'<div style="display:flex;align-items:center;gap:12px">'
    +  '<div class="li on" style="width:44px;height:44px">'+ic(d.kind==='audio'?'audio':'video',20,'var(--accent)')+'</div>'
    +  '<div class="lc"><div class="lt">'+rmtEsc(d.name)+'</div><div class="ls">Controle remoto</div></div>'
    +'</div>';
  if(roles.on!==undefined||roles.off!==undefined){
    html+='<div class="rmt-pw">';
    if(roles.on!==undefined) html+=btn(roles.on,'rmt-pb on',RMT_PWR+rmtEsc(list[roles.on].label));
    if(roles.off!==undefined) html+=btn(roles.off,'rmt-pb',RMT_PWR+rmtEsc(list[roles.off].label));
    html+='</div>';
  }
  if(hasDpad){
    html+='<div class="dpad">';
    [['up','u'],['down','d'],['left','l'],['right','r']].forEach(function(p){
      html+=btn(roles[p[0]],'dp '+p[1],'<svg viewBox="0 0 24 24"><path d="'+RMT_PATH[p[0]]+'"/></svg>');
    });
    if(roles.ok!==undefined) html+=btn(roles.ok,'dpok',rmtEsc(list[roles.ok].label));
    html+='</div>';
  }
  if(rest.length){
    html+='<div class="rmt-grid">'+rest.map(function(i){
      var ico=rmtIcon(list[i].label);
      return btn(i,'rb',ico+'<span>'+rmtEsc(list[i].label)+'</span>');
    }).join('')+'</div>';
  }
  return html+'</div>';
}

function acPt(r,deg){var a=deg*Math.PI/180;return [120+r*Math.cos(a),120+r*Math.sin(a)];}
function acArc(r,from,to){var s=acPt(r,from),e=acPt(r,to);return 'M'+s[0].toFixed(2)+' '+s[1].toFixed(2)+' A'+r+' '+r+' 0 '+((to-from)>180?1:0)+' 1 '+e[0].toFixed(2)+' '+e[1].toFixed(2);}
function acWidget(d){
  var mn=d.fb?18:16, mx=30, on=!!d.on;
  var val=Math.max(mn,Math.min(mx,d.val));
  var pct=(val-mn)/(mx-mn);
  var endDeg=135+pct*270;
  var gid='acg'+d.id;
  var N=(mx-mn)*2, ticks='';
  for(var i=0;i<=N;i++){
    var dg=135+i*270/N, major=(i%2===0);
    var p1=acPt(major?101:103,dg), p2=acPt(108,dg);
    var lit=on&&(i/N<=pct+0.0001);
    ticks+='<line x1="'+p1[0].toFixed(2)+'" y1="'+p1[1].toFixed(2)+'" x2="'+p2[0].toFixed(2)+'" y2="'+p2[1].toFixed(2)+'" stroke="'+(lit?'var(--accent)':'rgba(255,255,255,'+(major?'.22':'.10')+')')+'" stroke-width="'+(major?1.8:1.2)+'" stroke-linecap="round"/>';
  }
  var th=acPt(90,endDeg);
  var svg='<svg viewBox="0 0 240 240">'
    +'<defs><linearGradient id="'+gid+'" x1="0" y1="1" x2="1" y2="0"><stop offset="0" style="stop-color:var(--accent-2)"/><stop offset="1" style="stop-color:var(--accent)"/></linearGradient></defs>'
    +ticks
    +'<path d="'+acArc(90,135,405)+'" fill="none" stroke="rgba(255,255,255,.07)" stroke-width="10" stroke-linecap="round"/>'
    +((on&&pct>0.001)?'<path d="'+acArc(90,135,endDeg)+'" fill="none" stroke="url(#'+gid+')" stroke-width="10" stroke-linecap="round" style="filter:drop-shadow(0 0 9px var(--accent-glow-color))"/>':'')
    +(on?'<circle cx="'+th[0].toFixed(2)+'" cy="'+th[1].toFixed(2)+'" r="8" fill="#fff" style="filter:drop-shadow(0 0 8px var(--accent-glow-color))"/><circle cx="'+th[0].toFixed(2)+'" cy="'+th[1].toFixed(2)+'" r="3.4" fill="var(--accent)"/>':'')
    +'</svg>';
  var chips=d.fb?'':'<div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:18px"><div class="chip" data-action="toast" data-msg="Turbo ativado">Turbo</div><div class="chip" data-action="toast" data-msg="Visor alternado">Visor</div><div class="chip" data-action="toast" data-msg="Modo Dormir ativado">Dormir</div></div>';
  return '<div class="card acard'+(on?' on':'')+'">'
    +'<div style="display:flex;align-items:center;gap:12px">'
    +  '<div class="li'+(on?' on':'')+'">'+ic('hvac',20,on?'var(--accent)':'var(--t2)')+'</div>'
    +  '<div class="lc"><div class="lt">'+d.name+'</div><div class="ls">'+(on?'Ligado · '+val+'°C':'Desligado')+'</div></div>'
    +'</div>'
    +'<div class="acdial">'+svg
    +  '<div class="acmid">'
    +    '<div class="actemp" id="ac-temp-'+d.id+'" style="opacity:'+(on?1:.28)+'">'+val+'<small>°C</small></div>'
    +    '<div class="acstat'+(on?' on':'')+'">'+(on?'<i></i>Resfriando':'Desligado')+'</div>'
    +  '</div>'
    +  '<div class="acrange" style="left:50px">'+mn+'°</div><div class="acrange" style="right:50px">'+mx+'°</div>'
    +'</div>'
    +'<div class="accontrols">'
    +  '<button class="acstep'+(on?'':' dis')+'" data-action="actemp-delta" data-id="'+d.id+'" data-delta="-1" aria-label="Diminuir temperatura"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>'
    +  '<button class="acpw'+(on?' on':'')+'" data-action="devtoggle" data-id="'+d.id+'" aria-label="Ligar ou desligar"><svg viewBox="0 0 24 24"><path d="M12 3v8.5"/><path d="M6.4 6.9a8 8 0 1 0 11.2 0"/></svg></button>'
    +  '<button class="acstep'+(on?'':' dis')+'" data-action="actemp-delta" data-id="'+d.id+'" data-delta="1" aria-label="Aumentar temperatura"><svg viewBox="0 0 24 24"><path d="M12 5v14"/><path d="M5 12h14"/></svg></button>'
    +'</div>'
    +'<div class="acpwl">'+(on?'Toque para desligar':'Toque para ligar')+'</div>'
    +chips
    +'</div>';
}

function refreshAll(){renderHome();renderDevices();if(STATE.curRoom)renderRoomDetail(STATE.curRoom);}

function handleAction(el){
  var a=el.dataset.action;
  if(a==='page')goPage(el.dataset.page);
  else if(a==='selectuser')handleSelectUser(parseInt(el.dataset.id,10));
  else if(a==='switchuser')switchUser();
  else if(a==='submitpin')submitPin(parseInt(el.dataset.id,10));
  else if(a==='cancelpin')renderProfileScreen();
  else if(a==='room')goRoom(el.dataset.room);
  else if(a==='back')goBack();
  else if(a==='toast')toast(el.dataset.msg);
  else if(a==='scene'){
    var sid=parseInt(el.dataset.id,10);
    var sname=el.dataset.name;
    var scn=STATE.scenes.find(function(x){return x.id===sid;});
    if(scn && scn.fbScene){
      if(fbPublish({cmd:'scene', id:scn.fbScene})) toast(sname+' — executada');
    } else if(scn && scn.actions && scn.actions.length){
      // Cena customizada: dispara cada dispositivo real em sequência; sem vínculo, só simula localmente.
      var chain=Promise.resolve();
      var anyReal=false;
      scn.actions.forEach(function(act){
        var dev=STATE.devices.find(function(x){return x.id===act.deviceId;});
        if(!dev) return;
        dev.on=act.on;
        if(dev.fb && dev.fb.canToggle){ anyReal=true; fbToggle(dev); }
        if(dev.onScene && dev.offScene){
          anyReal=true;
          chain=chain.then(function(){ return sendDeviceCommand(dev); });
        }
      });
      refreshAll();
      chain.then(function(){ toast(sname+(anyReal?' — executada':' — executada (simulada)')); });
    } else if(STATE.appToken && sid>0){
      sendControlArtCommand('sendScene,'+sid, null, {priority:true}).then(function(r){
        toast(r.sent ? sname+' — executada' : 'Não consegui falar com a central agora');
      });
    } else {
      toast('Cena "'+sname+'" executada');
    }
  }
  else if(a==='devtoggle'){
    var id=parseInt(el.dataset.id,10);
    var d=STATE.devices.find(function(x){return x.id===id;});
    if(d){
      d.on=!d.on;
      refreshAll();
      if(d.fb){
        if(d.fb.canToggle){
          if(!fbToggle(d)){ d.on=!d.on; refreshAll(); }
        } else {
          d.on=!d.on; refreshAll();
          toast(d.name+' — sem comando de liga/desliga');
        }
      } else if(d.onScene && d.offScene){
        sendDeviceCommand(d).then(function(r){
          if(!r.sent){
            toast('Não consegui falar com a central agora');
            d.on=!d.on; refreshAll(); // desfaz — não confiar no otimista se nem saiu
          } else if(r.confirmed){
            toast(d.name+' — confirmado pela central');
          } else if(r.blind){
            toast(d.name+' — comando enviado (sem confirmação)');
          }
        });
      }
    }
  }
  else if(a==='curtainaction'){
    var cid=parseInt(el.dataset.id,10);
    var cmd=el.dataset.cmd; // 'open'|'close'|'stop'
    var cd=STATE.devices.find(function(x){return x.id===cid;});
    if(cd){
      var label = cmd==='open'?'Abrindo':cmd==='close'?'Fechando':'Parando';
      if(cd.fb){ if(fbSend(cd, cmd)) toast(label+' '+cd.name+'...'); return; }
      sendCurtainCommand(cd, cmd).then(function(r){
        if(r.noLink){
          toast(cmd==='stop' ? cd.name+' — "Parar" não tem cena cadastrada nesse projeto' : cd.name+' — sem comando real cadastrado (simulado)');
        } else if(!r.sent){
          toast('Não consegui falar com a central agora');
        } else if(r.confirmed || r.blind){
          toast(label+' '+cd.name+'...');
        }
      });
    }
  }
  else if(a==='roomtoggle'){
    var roomId=el.dataset.room;
    var room=STATE.rooms.find(function(r){return r.id===roomId;});
    var roomDevs=STATE.devices.filter(function(x){return x.room===roomId && !(x.fb && !x.fb.canToggle);});
    if(!room || !roomDevs.length) return;
    var turnOn=!roomDevs.every(function(x){return x.on;});
    roomDevs.forEach(function(x){ x.on=turnOn; });
    roomDevs.forEach(function(x){ if(x.fb) fbToggle(x); });
    refreshAll();
    if(room.onScene && room.offScene){
      // Cena única de ambiente encontrada no projeto — 1 chamada só, mais rápido e mais fiel.
      sendControlArtCommand('sendScene,'+(turnOn?room.onScene:room.offScene), null, {priority:true}).then(function(r){
        toast(r.sent ? room.name+' — '+(turnOn?'tudo ligado':'tudo desligado') : 'Não consegui falar com a central agora');
      });
    } else {
      // Sem cena de ambiente pronta: dispara cada dispositivo com vínculo real, em sequência.
      var realDevs=roomDevs.filter(function(x){return x.onScene && x.offScene;});
      if(!realDevs.length){ toast(room.name+' — '+(turnOn?'tudo ligado':'tudo desligado')); return; }
      var chain=Promise.resolve();
      realDevs.forEach(function(x){
        chain=chain.then(function(){ return sendDeviceCommand(x); });
      });
      chain.then(function(){ toast(room.name+' — '+(turnOn?'tudo ligado':'tudo desligado')); });
    }
  }
  else if(a==='irbtn'){
    var did=parseInt(el.dataset.id,10);
    var didx=parseInt(el.dataset.idx,10);
    var dev=STATE.devices.find(function(x){return x.id===did;});
    if(!dev || !dev.irButtons || !dev.irButtons[didx]) return;
    var btn=dev.irButtons[didx];
    el.style.opacity='.5';
    sendControlArtCommand(btn.payload).then(function(r){
      el.style.opacity='';
      if(r.sent && r.raw && r.raw.indexOf('completeir')!==-1){
        toast(dev.name+' — '+btn.label+' enviado');
      } else if(r.sent){
        toast(dev.name+' — comando enviado (sem confirmação)');
      } else {
        toast('Não consegui falar com a central agora');
      }
    });
  }
  else if(a==='fbbtn'){
    var fid=parseInt(el.dataset.id,10);
    var fidx=parseInt(el.dataset.idx,10);
    var fdev=STATE.devices.find(function(x){return x.id===fid;});
    if(!fdev || !fdev.fb || !fdev.fb.buttons || !fdev.fb.buttons[fidx]) return;
    var fbtn=fdev.fb.buttons[fidx];
    if(fbSend(fdev, fbtn.action, fbtn.args)) toast(fdev.name+' — '+fbtn.label+' enviado');
  }
  else if(a==='actemp'){var id2=parseInt(el.dataset.id,10);var d2=STATE.devices.find(function(x){return x.id===id2;});if(d2){d2.val=parseInt(el.dataset.temp,10);var disp=$('#ac-temp-'+id2);if(disp)disp.textContent=d2.val+'°';if(STATE.curRoom)renderRoomDetail(STATE.curRoom);renderDevices();toast(d2.name+': '+d2.val+'°');}}
  else if(a==='actemp-delta'){var id3=parseInt(el.dataset.id,10);var d3=STATE.devices.find(function(x){return x.id===id3;});if(d3){if(!d3.on){toast('Ligue o ar para ajustar a temperatura');return;}d3.val=Math.max(d3.fb?18:16,Math.min(30,d3.val+parseInt(el.dataset.delta,10)));if(STATE.curRoom)renderRoomDetail(STATE.curRoom);renderDevices();toast(d3.name+': '+d3.val+'°');if(d3.fb&&d3.fb.setpoint)fbSetpoint(d3);}}
}

function hxSaveUser(){
  var first=!STATE.users.length;
  var idv=document.getElementById('hx-id').value;
  var name=hxClean(document.getElementById('hx-name').value);
  var pin=document.getElementById('hx-pin').value.trim();
  var segOn=document.querySelector('.segi.on');
  var role=first?'admin':(segOn?segOn.dataset.role:'family');
  var rooms=$all('#hx-rooms .tog.on').map(function(t){return t.parentNode.dataset.room;});
  var err=document.getElementById('hx-err');
  function bad(m){err.textContent=m;}
  if(!name) return bad('Digite o nome do usuário.');
  if(!/^\d{4,6}$/.test(pin)) return bad('A senha precisa ter de 4 a 6 números.');
  var eid=idv===''?null:parseInt(idv,10);
  if(STATE.users.some(function(x){return x.name.toLowerCase()===name.toLowerCase()&&x.id!==eid;})) return bad('Já existe um usuário com esse nome.');
  if(role==='family'&&!rooms.length) return bad('Libere pelo menos um ambiente para este usuário.');
  if(eid!==null){
    var u=STATE.users.find(function(x){return x.id===eid;});
    var admins=STATE.users.filter(function(x){return x.role==='admin';});
    if(u.role==='admin'&&role!=='admin'&&admins.length<=1) return bad('Precisa existir pelo menos um administrador.');
    u.name=name;u.pin=pin;u.role=role;u.rooms=role==='admin'?[]:rooms;
    if(STATE.currentUser&&STATE.currentUser.id===u.id) STATE.currentUser=u;
  } else {
    var nid=1000+STATE.users.reduce(function(m,x){return Math.max(m,x.id>=1000?x.id-1000+1:0);},0);
    var nu={id:nid,name:name,pin:pin,role:role,rooms:role==='admin'?[]:rooms,local:true};
    STATE.users.push(nu);
    if(first){ saveCurrentUser(nu); }
  }
  persistLocal(); closeSheet(); hxRefresh(); toast(eid!==null?'Usuário atualizado':'Usuário adicionado');
}

  });
}
function photoSet(id,url){
  var r=photoRoom(id); if(!r) return false;
  var m=photoMap(); m[r.id]=url;
  if(!photoStore(m)) return false;
  if(r.photoOrig===undefined) r.photoOrig=r.photo||null;
  r.photo=url; r.photoCustom=true; return true;
}
function photoResize(file,max,q){
  return new Promise(function(res,rej){
    var fr=new FileReader();
    fr.onerror=function(){rej();};
    fr.onload=function(){
      var img=new Image();
      img.onerror=function(){rej();};
      img.onload=function(){
        var w=img.naturalWidth,h=img.naturalHeight,k=Math.min(1,max/Math.max(w,h));
        var c=document.createElement('canvas'); c.width=Math.max(1,Math.round(w*k)); c.height=Math.max(1,Math.round(h*k));
        var x=c.getContext('2d'); x.fillStyle='#000'; x.fillRect(0,0,c.width,c.height); x.drawImage(img,0,0,c.width,c.height);
        res(c.toDataURL('image/jpeg',q));
      };
      img.src=fr.result;
    };
    fr.readAsDataURL(file);
  });
}
function photoInput(){
  var i=document.getElementById('hx-file');
  if(i) return i;
  i=document.createElement('input'); i.type='file'; i.accept='image/*'; i.id='hx-file'; i.style.display='none';
  i.addEventListener('change',function(){
    var f=i.files&&i.files[0], id=photoPending; i.value='';
    if(!f||!id) return;
    toast('Processando foto…');
    photoResize(f,1280,.8).then(function(u){
      if(!photoSet(id,u)) return photoResize(f,960,.68).then(function(u2){ if(!photoSet(id,u2)) throw 0; });
    }).then(function(){ photoDone('Foto atualizada'); })
      .catch(function(){ toast('Não consegui salvar a foto (arquivo inválido ou sem espaço no aparelho)'); });
  });
  document.body.appendChild(i);
  return i;
}
function photoPick(id){ photoPending=id; photoInput().click(); }
function photoReset(id){
  var r=photoRoom(id); if(!r) return;
  var m=photoMap(); delete m[r.id]; photoStore(m);
  var had=!!r.photoOrig;
  r.photo=r.photoOrig||null; r.photoCustom=false;
  photoDone(had?'Foto original restaurada':'Foto removida');
}
function photoDone(msg){
  var p=document.querySelector('#sheet .sheet-p'), st=p?p.scrollTop:0;
  photoSheet();
  var p2=document.querySelector('#sheet .sheet-p'); if(p2) p2.scrollTop=st;
  hxRefresh(); if(STATE.curRoom) renderRoomDetail(STATE.curRoom);
  toast(msg);
}
function photoSheet(){
  var h=hxHead('Fotos dos ambientes')
    +'<div class="hx-note" style="margin:0 0 12px">Escolha uma foto da galeria ou tire na hora. Ela aparece no card e no topo de cada ambiente.</div><div class="hxl">'
    +STATE.rooms.map(function(r){
      var has=!!r.photo, cust=!!r.photoCustom;
      return '<div class="lr" style="cursor:default"><div class="ph-th" style="'+roomBg(r.id)+'">'+(has?'':ic('home',18,'var(--t3)'))+'</div>'
        +'<div class="lc"><div class="lt" style="font-size:14.5px">'+rmtEsc(r.name)+'</div><div class="ls">'+(cust?'Foto personalizada':(has?'Foto original':'Sem foto'))+'</div></div>'
        +'<div class="ph-act"><span class="add" data-hx="photopick" data-room="'+r.id+'">'+(has?'Trocar':'Adicionar')+'</span>'
        +(cust?'<span class="off" data-hx="photodel" data-room="'+r.id+'">'+(r.photoOrig?'Original':'Remover')+'</span>':'')+'</div></div>';
    }).join('')+'</div>'
    +'<div class="hx-note">As fotos ficam salvas só neste aparelho e são reduzidas automaticamente para economizar espaço.</div>';
  openSheet(h);
}

// Número do suporte no formato internacional, só dígitos (ex.: 5544999999999). Vazio = abre o WhatsApp para escolher o contato.
var SUPPORT_WHATSAPP='5534996574000';
function openSupport(){
  var msg='Olá! Preciso de suporte no app House ON ('+STATE.clientName+').';
  var url='https://wa.me/'+SUPPORT_WHATSAPP.replace(/\D/g,'')+'?text='+encodeURIComponent(msg);
  var w=window.open(url,'_blank','noopener');
  if(!w) location.href=url;
}
function hxAct(t){
  var a=t.dataset.hx;
  if(a==='photos') photoSheet();
  else if(a==='photopick') photoPick(t.dataset.room);
  else if(a==='photodel') photoReset(t.dataset.room);
  else if(a==='support') openSupport();
  else if(a==='close') closeSheet();
  else if(a==='users') userSheet(null);
  else if(a==='edituser') userSheet(parseInt(t.dataset.id,10));
  else if(a==='deluser'){
    var id=parseInt(t.dataset.id,10);
    STATE.users=STATE.users.filter(function(x){return x.id!==id;});
    persistLocal(); userSheet(null); renderMore(); toast('Usuário excluído');
  }
  else if(a==='role'){
    $all('.segi[data-hx="role"]').forEach(function(x){x.classList.remove('on');}); t.classList.add('on');
    document.getElementById('hx-rooms').style.display=t.dataset.role==='family'?'block':'none';
  }
  else if(a==='roomchk'){ t.querySelector('.tog').classList.toggle('on'); }
  else if(a==='saveuser') hxSaveUser();
  else if(a==='newscene') sceneSheet();
  else if(a==='sicon'){ $all('#hx-icons .segi').forEach(function(x){x.classList.remove('on');}); t.classList.add('on'); }
  else if(a==='dst'){
    var row=t.closest('[data-dev]'), v=t.dataset.v;
    var same=row.dataset.st===v; row.dataset.st=same?'':v;
    $all('span',row).forEach(function(x){x.classList.remove('on','off');});
    if(!same) t.classList.add(v==='on'?'on':'off');
  }
  else if(a==='favchk'){ document.getElementById('hx-fav').classList.toggle('on'); }
  else if(a==='savescene') hxSaveScene();
  else if(a==='delscene'){
    var sid=parseInt(t.dataset.id,10);
    STATE.scenes=STATE.scenes.filter(function(c){return c.id!==sid;});
    persistLocal(); sceneSheet(); hxRefresh(); toast('Cena excluída');
  }
}
document.addEventListener('click',function(e){var t=e.target.closest('[data-hx]');if(t)hxAct(t);});

loadLocalData();
STATE.currentUser=loadCurrentUser();
fbConnect();
renderHome();renderRooms();renderScenes();renderDevices();renderMore();
if(STATE.users.length && !STATE.currentUser){
  renderProfileScreen();
  document.getElementById('p-home').classList.remove('active');
  document.getElementById('p-profile').classList.add('active');
  document.getElementById('nav').style.display='none';
  STATE.curPage='p-profile';
  STATE.history=['p-profile'];
} else {
  startPolling();
}
</script></body></html>
